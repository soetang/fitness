functions:
  - title: Run Ruff lint checks through Fitness
    type: meta
    tool: layout
    rules: [fitness-owns-ruff-check]
    guidance: Remove direct ruff check commands from justfile recipes. Use the fitness recipe for lint evaluation; fmt only formats.
  - title: Keep architecture definitions architecture-only
    type: meta
    tool: layout
    rules: [architecture-function-type]
    guidance: Only functions with type architecture belong in fitness/functions/architecture.yaml.
  - title: Keep Ruff configuration in fitness definitions
    type: meta
    tool: layout
    rules: [ruff-config-location]
    guidance: Put invocation and formatting controls in fitness/tool.yaml and rule selections and settings in fitness/functions/. Do not add tool.ruff configuration to pyproject.toml.
