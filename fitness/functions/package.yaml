description: Python code quality, typing, and source/test maintainability.
functions:
  - title: Keep source and test Python files within the line limit
    type: maintainability
    tool: layout
    rules: [source-test-file-length]
    config:
      max_lines: 400
    guidance: Modularize files into smaller cohesive modules.
  - title: Keep Python code free of lint diagnostics
    type: lint
    tool: ruff
    rules: [E, F, I, UP, SIM]
    config:
      pycodestyle:
        max-line-length: 100
  - title: Keep Python code type-correct
    type: typing
    tool: pyrefly
  - title: Use only rule-specific lint suppressions
    type: maintainability
    tool: ruff
    rules: [PGH004]
    guidance: Specify the rule ID in noqa directives instead of suppressing all diagnostics.
