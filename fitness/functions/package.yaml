description: Python code quality, typing, and source/test maintainability.
functions:
  - title: Keep function cyclomatic complexity within the limit
    type: maintainability
    tool: ruff
    rules: [C901]
    config:
      mccabe:
        max-complexity: 8
    guidance: >-
      Refactor complex functions into smaller, cohesive functions named for domain
      operations. Keep orchestration readable by separating steps such as running
      fitness functions and formatting their results.
  - title: Keep source and test Python files within the line limit
    type: maintainability
    tool: layout
    rules: [source-test-file-length]
    config:
      max_lines: 400
    guidance: Modularize files into smaller cohesive modules.
  - title: Keep Python code free of lint diagnostics
    type: lint
    tool: ruff
    rules: [E, F, I, UP, SIM]
    config:
      pycodestyle:
        max-line-length: 100
  - title: Keep Python code type-correct
    type: typing
    tool: pyrefly
  - title: Use only rule-specific lint suppressions
    type: maintainability
    tool: ruff
    rules: [PGH004]
    guidance: Specify the rule ID in noqa directives instead of suppressing all diagnostics.
