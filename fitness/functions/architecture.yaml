functions:
  - title: Run Ruff lint checks through Fitness
    type: architecture
    tool: layout
    rules: [fitness-owns-ruff-check]
    guidance: Remove direct ruff check commands from justfile recipes. Use the fitness recipe for lint evaluation; fmt only formats.
  - title: Keep adapter tests beside their adapters
    type: architecture
    tool: layout
    rules: [adapter-test-location]
    guidance: Move adapter tests into fitness/tool/<name>/ beside adapter.py.
  - title: Give each adapter its own folder and tests
    type: architecture
    tool: layout
    rules: [adapter-folder]
    guidance: Use fitness/tool/<name>/adapter.py and colocated test_*.py modules.
  - title: Use Pydantic models instead of dataclasses
    type: architecture
    tool: ruff
    rules: [TID251]
    config:
      flake8-tidy-imports:
        banned-api:
          dataclasses:
            msg: Use a Pydantic BaseModel instead of standard-library dataclasses.
          pydantic.dataclasses:
            msg: Use a Pydantic BaseModel instead of Pydantic dataclasses.
    guidance: Define data models using Pydantic BaseModel or the shared Model base class.
