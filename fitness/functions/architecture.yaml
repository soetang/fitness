functions:
  - title: Keep feature tests with their corresponding feature
    type: architecture
    tool: layout
    rules: [feature-test-location]
    guidance: Put tests that use a feature contract in tests/features/<feature_name>/.
  - title: Keep each feature within one combined token budget
    type: architecture
    tool: layout
    rules: [feature-token-budget]
    config:
      budget: 15000
      encoding: cl100k_base
      associated_files:
        lint: [tests/test_cli.py, tests/conftest.py, "tests/fixtures/**/*"]
        check: [tests/test_cli.py, tests/conftest.py, "tests/fixtures/**/*"]
    guidance: Consider breaking into multiple cohesive features.
  - title: Access features only through their public contracts
    type: architecture
    tool: layout
    rules: [contract-only-feature-access]
    guidance: Import the feature contract. Shared domain contracts must not depend on features.
  - title: Keep dependencies without source usage out of runtime requirements
    type: architecture
    tool: layout
    rules: [dependency-placement]
    config:
      module_mapping:
        typer: [typer]
        pydantic: [pydantic]
        pyyaml: [yaml]
    guidance: Move dependencies unused by src/ to the dev group; retain build-only requirements in build-system.requires.
  - title: Run Ruff lint checks through Fitness
    type: architecture
    tool: layout
    rules: [fitness-owns-ruff-check]
    guidance: Remove direct ruff check commands from justfile recipes. Use the fitness recipe for lint evaluation; fmt only formats.
  - title: Keep adapter tests beside their adapters
    type: architecture
    tool: layout
    rules: [adapter-test-location]
    guidance: Move adapter tests into fitness/tool/<name>/ beside adapter.py.
  - title: Give each adapter its own folder and tests
    type: architecture
    tool: layout
    rules: [adapter-folder]
    guidance: Use fitness/tool/<name>/adapter.py and colocated test_*.py modules.
  - title: Use Pydantic models instead of dataclasses
    type: architecture
    tool: ruff
    rules: [TID251]
    config:
      flake8-tidy-imports:
        banned-api:
          dataclasses:
            msg: Use a Pydantic BaseModel instead of standard-library dataclasses.
          pydantic.dataclasses:
            msg: Use a Pydantic BaseModel instead of Pydantic dataclasses.
    guidance: Define data models using Pydantic BaseModel or the shared Model base class.
