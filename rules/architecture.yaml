functions:
  - title: Keep adapter tests beside their adapters
    type: architecture
    tool: layout
    rules: [adapter-test-location]
    guidance: Move adapter tests into tool/<name>/ beside adapter.py.
  - title: Give each adapter its own folder and tests
    type: architecture
    tool: layout
    rules: [adapter-folder]
    guidance: Use tool/<name>/adapter.py and colocated test_*.py modules.
  - title: Keep architecture definitions architecture-only
    type: architecture
    tool: layout
    rules: [architecture-function-type]
    guidance: Only functions with type architecture belong in rules/architecture.yaml.
  - title: Use Pydantic models instead of dataclasses
    type: architecture
    tool: ruff
    rules: [TID251]
    config:
      flake8-tidy-imports:
        banned-api:
          dataclasses:
            msg: Use a Pydantic BaseModel instead of standard-library dataclasses.
          pydantic.dataclasses:
            msg: Use a Pydantic BaseModel instead of Pydantic dataclasses.
    guidance: Define data models using Pydantic BaseModel or the shared Model base class.
