[project]
name = "fitness"
version = "0.1.0"
description = "A small fitness-function CLI prototype"
requires-python = ">=3.11"
dependencies = ["typer>=0.16", "pydantic>=2", "pyyaml>=6"]

[project.scripts]
fitness = "fitness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness"]

[dependency-groups]
dev = [
    "packaging>=25",
    "pyrefly>=1.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
    "semgrep==1.181.0",
    "tiktoken>=0.12",
    "tomli-w>=1.2.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests", "fitness/tool"]
addopts = "-qq --no-header --tb=short --import-mode=importlib --cov --cov-report= -n auto --maxprocesses=4 --dist=loadgroup"

[tool.coverage.run]
source = ["src/fitness"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pyrefly]
search-path = ["fitness/tool/layout"]
project-includes = ["src", "tests", "fitness/tool"]
python-version = "3.11"

[tool.pyrefly.errors]
explicit-any = "error"
implicit-any = "error"
