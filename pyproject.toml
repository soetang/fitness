[project]
name = "fitness"
version = "0.1.0"
description = "A small fitness-function CLI prototype"
requires-python = ">=3.11"
dependencies = ["typer>=0.16", "pydantic>=2", "pyyaml>=6"]

[project.scripts]
fitness = "fitness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "tool"]
addopts = "--import-mode=importlib --cov=fitness --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["fitness"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pyrefly]
project-includes = ["src", "tests", "tool"]
python-version = "3.11"

[tool.pyrefly.errors]
explicit-any = "error"
implicit-any = "error"
